[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/capto-core",
  "crates/capto-capture",
  "crates/capto-audio",
  "crates/capto-encode",
  "crates/capto-overlay",
  "crates/capto-hooks",
  "crates/capto-ipc",
  "crates/capto-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["elwina"]
repository = "https://github.com/ciryanna/Capto"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
capto-core = { path = "crates/capto-core" }
capto-capture = { path = "crates/capto-capture" }
capto-audio = { path = "crates/capto-audio" }
capto-encode = { path = "crates/capto-encode" }
capto-overlay = { path = "crates/capto-overlay" }
capto-hooks = { path = "crates/capto-hooks" }
capto-ipc = { path = "crates/capto-ipc" }
axum = "0.8"
tower = "0.5"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
