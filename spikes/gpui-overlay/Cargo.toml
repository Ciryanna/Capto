[package]
name = "capto-gpui-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "GPUI overlay spike — validates transparent always-on-top windows, click-through, and drag-select for the Tauri->GPUI evaluation"

[[bin]]
name = "gpui-overlay-spike"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
raw-window-handle = "0.6"
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
