name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust test / clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Download Capto FFmpeg (host)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTO_FFMPEG_VERIFY_ATTESTATION: "1"
        run: |
          # Tauri externalBin requires ffmpeg-<host-triple>.exe when building capto-app.
          .\scripts\download-ffmpeg.ps1 -VerifyAttestation

      - name: Stage CLI for Tauri resources
        shell: pwsh
        run: |
          # tauri.conf.json bundles binaries/capto.exe as resources — build.rs fails if missing.
          cargo build -p capto-cli
          .\scripts\copy-cli.ps1 -Profile debug

      - name: Test capto-dsh-plugin against real CLI
        shell: pwsh
        run: |
          # target/debug/capto.exe was built above; the plugin's real-CLI
          # smoke check exercises the desktopUnavailable (exit 2) path on CI.
          Push-Location packages/capto-dsh-plugin
          npm ci --no-audit --no-fund
          node test/smoke.mjs

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      - name: cargo clippy --workspace
        # Warn-only for now; tighten to `-D warnings` once the workspace is clean.
        run: cargo clippy --workspace --all-targets

      - name: Record workspace build timing
        # cargo's native `--timings` flag writes a build timing report to
        # target/cargo-timings/; upload it so build performance is tracked
        # across runs (build_performance_tracking).
        run: cargo build --workspace --timings

      - name: Upload cargo build timing report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-timing
          path: target/cargo-timings/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint + tests + typecheck
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Duplicate code gate (jscpd)
        run: npm run duplicate:check
      - name: Dead-code / unused-dependency scan (knip)
        run: npm run knip
      - name: Frontend tests (coverage + timing report)
        run: npm run test:coverage -- --reporter=json --outputFile=coverage/test-results.json
      - name: Upload Vitest timing report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-results
          path: apps/desktop/coverage/test-results.json
          if-no-files-found: error
      - run: npx tsc --noEmit
      - name: Frontend production build
        # Real vite build in CI: catches bundling breakage lint/tsc cannot.
        run: npm run build
      - name: Bundle-size gate (heavy dependency detection)
        run: |
          npm run build:analyze
          npm run bundle-size
      - name: Upload bundle-size report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-report
          path: apps/desktop/dist/stats.json
          if-no-files-found: error

  hygiene:
    name: Repo hygiene (file size + tech debt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: large_file_detection guard
        shell: pwsh
        run: |
          .\scripts\check-file-size.ps1 -OutFile check-file-size.txt

      - name: tech_debt_tracking scan
        shell: pwsh
        run: |
          .\scripts\scan-tech-debt.ps1 -OutFile tech-debt-report.txt

      - name: pii_handling scan (emails / SSNs / cards / private keys)
        shell: pwsh
        run: |
          .\scripts\scan-pii.ps1

      - name: agents_md_validation
        shell: pwsh
        run: |
          .\scripts\validate-agents-md.ps1

      - name: version_drift_detection (npm vs tauri.conf)
        shell: pwsh
        run: |
          .\scripts\check-version-drift.ps1

      - name: dead_feature_flag_detection scan
        shell: pwsh
        run: |
          .\scripts\scan-dead-flags.ps1

      - name: Upload hygiene reports
        uses: actions/upload-artifact@v4
        with:
          name: repo-hygiene-reports
          path: |
            check-file-size.txt
            tech-debt-report.txt
          if-no-files-found: ignore

  check-targets:
    name: Check ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: check-${{ matrix.arch }}

      - name: Download Capto FFmpeg (${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTO_FFMPEG_VERIFY_ATTESTATION: "1"
        run: |
          .\scripts\download-ffmpeg.ps1 -TargetTriple "${{ matrix.target }}" -VerifyAttestation
          $path = "apps/desktop/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe"
          if (-not (Test-Path $path)) { throw "missing $path" }
          Write-Host "OK $path ($((Get-Item $path).Length) bytes)"

      - name: Stage CLI for Tauri resources
        shell: pwsh
        run: |
          cargo build -p capto-cli --target ${{ matrix.target }}
          .\scripts\copy-cli.ps1 -TargetTriple "${{ matrix.target }}" -Profile debug
          if (-not (Test-Path "apps/desktop/src-tauri/binaries/capto.exe")) {
            throw "missing apps/desktop/src-tauri/binaries/capto.exe"
          }

      - name: cargo check (desktop + cli)
        run: cargo check -p capto-app -p capto-cli --target ${{ matrix.target }}

  packages:
    name: Agent packages (skill + dsh plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: npm pack dry-run (skill)
        run: npm pack ./packages/capto-agent-skill --dry-run
      - name: Test capto-dsh-plugin (fake CLI)
        working-directory: packages/capto-dsh-plugin
        run: |
          npm ci --no-audit --no-fund
          node test/smoke.mjs
      - name: npm pack dry-run (plugin)
        working-directory: packages/capto-dsh-plugin
        run: npm pack --dry-run

  devcontainer:
    name: Devcontainer builds + runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build devcontainer and smoke-test the toolchain
        # Continuously verifies .devcontainer/devcontainer.json actually
        # builds and runs (devcontainer_runnable) instead of only existing on
        # disk. The smoke command only checks the toolchain (rust/node/pwsh);
        # compiling native capture crates needs OS audio/display headers CI
        # cannot provide. push: never keeps it a pure build+run gate (this
        # repo has no write access to the ghcr.io/ciryanna package).
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/ciryanna/capto-devcontainer
          cacheFrom: ghcr.io/ciryanna/capto-devcontainer:latest
          push: never
          runCmd: bash -lc 'cargo --version && node --version && pwsh --version'
