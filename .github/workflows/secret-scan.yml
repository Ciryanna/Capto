name: Secret scanning

# Gitleaks finds hardcoded secrets (API keys, tokens, private keys) in the
# repo history and working tree. Complements GitHub's (currently disabled)
# secret scanning, which only catches known provider patterns.
#
# See docs/runbooks/security.md for response steps if this fires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload SARIF (if findings reporting is added)

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so pushes that add then scrub a secret still trip.
          fetch-depth: 0

      - name: Run gitleaks
        # Run the upstream gitleaks binary directly (MIT) instead of
        # gitleaks-action, which requires a paid GITLEAKS_LICENSE for
        # organization-owned repos (ciryanna is an org). Scan behavior is
        # identical: full history, redacted output, non-zero exit on findings.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
