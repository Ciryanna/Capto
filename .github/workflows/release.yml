name: Release

# Windows x64 + arm64 installers with FFmpeg + CLI embedded from the Capto build.
# Separate from CI. Do not attach standalone CLI release assets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create draft GitHub release"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.arch }}

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Download Capto FFmpeg (${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTO_FFMPEG_VERIFY_ATTESTATION: "1"
        run: |
          .\scripts\download-ffmpeg.ps1 -TargetTriple "${{ matrix.target }}" -VerifyAttestation
          Get-Item "apps/desktop/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe" | Format-List Name, Length

      - name: Build and stage CLI (`capto`)
        shell: pwsh
        run: |
          cargo build -p capto-cli --release --target ${{ matrix.target }}
          .\scripts\copy-cli.ps1 -TargetTriple "${{ matrix.target }}" -Profile release
          Get-Item "apps/desktop/src-tauri/binaries/capto.exe" | Format-List Name, Length

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Capto v__VERSION__
          releaseBody: |
            Capto **v__VERSION__** (Windows).

            - Bundled FFmpeg from [`ciryanna/capto-ffmpeg`](https://github.com/ciryanna/capto-ffmpeg) (SHA-256 + attestation; pin in `.github/capto-ffmpeg.env`)
            - Bundled CLI (`<install>\cli\capto.exe`) added to user PATH — not a separate download
            - Architectures: **x64**, **arm64**
            - Installer: NSIS `.exe` setup (signed updater artifacts included)
            - In-app updates read `latest.json` from the rolling [`updater`](https://github.com/ciryanna/Capto/releases/tag/updater) channel

            Install the setup matching your CPU. After install, open a **new** terminal and run `capto doctor`.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: --target ${{ matrix.target }} --bundles nsis

  # v0.* tags were prerelease (v1+ are stable). Either way, keep a rolling
  # `updater` tag holding only latest.json so the in-app check URL never
  # changes and always points at the newest release.
  publish-updater-manifest:
    name: Publish updater manifest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest.json from versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'latest.json' --dir .
          test -f latest.json
          echo "--- latest.json ---"
          cat latest.json

      - name: Ensure updater channel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view updater --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create updater \
              --repo "${{ github.repository }}" \
              --title "Updater channel" \
              --notes "Rolling \`latest.json\` for Capto in-app updates. Download installers from versioned \`v*\` releases — this tag only hosts the updater manifest." \
              --prerelease
          fi

      - name: Publish latest.json to updater channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload updater latest.json --repo "${{ github.repository }}" --clobber

  # This repo has no PR workflow, so release notes are generated from commit
  # history: every commit subject since the previous release is appended to
  # the GitHub Release body. Conventional-commit trailers are stripped.
  generate-changelog:
    name: Append commit changelog to release notes
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Append changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Previous release tag = the one before this one in release order.
          PREV="$(gh api "repos/${{ github.repository }}/releases" --jq 'map(.tag_name) | .[1] // empty')"
          RANGE="${PREV:+${PREV}..}${TAG}"
          NOTES="$(
            gh api "repos/${{ github.repository }}/compare/${RANGE}" --jq '.commits[].commit.message' \
              | grep -Ev '^\s*(Co-authored-by|Signed-off-by|Co-Authored-By|ci:|chore\(release\))' \
              | grep -v '^\s*$' \
              | head -n 80 \
              | sed 's/^/- /'
          )"
          BODY="$(mktemp)"
          gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.body' > "$BODY"
          {
            printf '\n---\n\n## Commits (auto-generated)\n\n'
            printf '%s\n' "$NOTES"
          } >> "$BODY"
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$BODY"
          echo "Appended changelog to release $TAG"
